name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the project
        run: |
          test -f make.sh || { echo "make.sh is missing - add it to the repository first"; exit 1; }
          mkdir project
          cd project
          bash ../make.sh

      - name: Add the private signing key (if you set the secrets)
        env:
          KEYSTORE_B64: ${{ secrets.KEYSTORE_B64 }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$KEYSTORE_PASSWORD" ]; then
            echo "$KEYSTORE_B64" | base64 -d > project/app/watchu.keystore
            echo "Private key added."
          else
            echo "::warning::Secrets not set, using the default key. Updates will need an uninstall first."
          fi

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk Watchu.apk
          gh release create "build-${{ github.run_number }}" Watchu.apk --title "Watchu build ${{ github.run_number }}" --notes "Install Watchu.apk on your tablet."
