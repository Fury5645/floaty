name: Build APK

on:
  workflow_dispatch:
  push:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Create the project
        run: |
          test -f make.sh || { echo "make.sh is missing - add it to the repository first"; exit 1; }
          mkdir project
          cd project
          bash ../make.sh

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Build
        working-directory: project
        env:
          BUILD_NUMBER: ${{ github.run_number }}
        run: gradle assembleDebug --no-daemon --stacktrace

      - name: Publish APK
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp project/app/build/outputs/apk/debug/app-debug.apk Watchu.apk
          gh release create "build-${{ github.run_number }}" Watchu.apk --title "Watchu build ${{ github.run_number }}" --notes "Install Watchu.apk on your tablet."
